<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>Gridlock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Mono:wght@500;700&family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="menu" id="menu" aria-label="Main menu">
    <div class="menu-scene" aria-hidden="true">
      <span class="moon"></span>
      <span class="star-dot" style="left: 10%; top: 14%"></span>
      <span class="star-dot" style="left: 28%; top: 7%"></span>
      <span class="star-dot" style="left: 57%; top: 17%"></span>
      <span class="star-dot" style="left: 92%; top: 22%"></span>
      <span class="star-dot" style="left: 71%; top: 5%"></span>
      <span class="wire"></span>
    </div>

    <div class="menu-inner">
      <div class="menu-top">
        <span class="menu-version" id="menu-version">1.0</span>
        <span class="menu-stars" id="menu-stars">★ 0/21</span>
      </div>
      <div class="hanging-light" id="menu-housing" data-lit="green" aria-hidden="true">
        <span class="hl-cable"></span>
        <span class="hl-box"><span class="hl-lamp red"></span><span class="hl-lamp amber"></span><span class="hl-lamp green"></span></span>
      </div>
      <header class="menu-title">
        <h1><span class="t2">Gridlock</span></h1>
        <p class="menu-shift" id="menu-shift">Signal duty · Shift 1</p>
      </header>
      <div class="menu-spacer"></div>
    </div>
    <div class="skyline" aria-hidden="true">
      <span class="bldg" style="--w: 13%; --h: 62%; --lit: #ffd96a"></span>
      <span class="bldg dark" style="--w: 9%; --h: 44%"></span>
      <span class="bldg" style="--w: 16%; --h: 82%; --lit: #ffd96a"></span>
      <span class="bldg dark" style="--w: 10%; --h: 54%"></span>
      <span class="bldg" style="--w: 14%; --h: 72%; --lit: #7fd7ff"></span>
      <span class="bldg dark" style="--w: 9%; --h: 40%"></span>
      <span class="bldg" style="--w: 19%; --h: 66%; --lit: #ffd96a"></span>
      </div>
    <div class="street" aria-hidden="true"><span class="lane-line"></span><span class="menu-car east"></span><span class="menu-car west"></span></div>
    <div class="menu-ground">
      <nav class="menu-list" aria-label="Main menu">
        <button class="menu-item first" type="button" data-menu="play"><span class="cursor" aria-hidden="true">▶</span><span class="item-label" id="menu-continue">Play</span><span class="item-note" id="menu-continue-sub">First Shift</span></button>
        <button class="menu-item" type="button" data-menu="freeplay"><span class="cursor" aria-hidden="true">▶</span><span class="item-label">Freeplay</span><span class="item-note">Any map</span></button>
        <button class="menu-item" type="button" data-menu="levels"><span class="cursor" aria-hidden="true">▶</span><span class="item-label">Levels</span><span class="item-note" id="menu-levels-note"></span></button>
        <button class="menu-item" type="button" data-menu="records"><span class="cursor" aria-hidden="true">▶</span><span class="item-label">Records</span><span class="item-note" id="menu-best">No shifts yet</span></button>
        <button class="menu-item" type="button" data-menu="settings"><span class="cursor" aria-hidden="true">▶</span><span class="item-label">Settings</span><span class="item-note"></span></button>
        <button class="menu-item" type="button" data-menu="help"><span class="cursor" aria-hidden="true">▶</span><span class="item-label">How to play</span><span class="item-note"></span></button>
      </nav>
    </div>
  </section>

  <section class="game" id="game" hidden aria-label="Intersection">
    <header class="hud" aria-label="Shift stats">
      <div class="hud-row">
        <button class="round-btn" id="pause-btn" type="button" aria-label="Pause" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <div class="hud-score" id="score-box">
          <span class="mono-label"><span id="stat-level">1. First Shift</span><span class="post-part"> · <span id="post">Main St &amp; 1st Ave</span></span></span>
          <span class="score-line"><span id="stat-score">0</span><span class="combo" id="stat-combo" hidden>×1.5</span></span>
        </div>
        <div class="hud-cleared">
          <span class="cleared-line" id="stat-cleared">0 / 20</span>
          <span class="mono-label">Crashes <span id="stat-crashes" data-level="ok">0 / 3</span><span class="time-part"><span class="time-dot"> · </span><span id="stat-time">0:00</span></span></span>
        </div>
        <button class="round-btn" id="levels-btn" type="button" aria-label="Levels">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
        </button>
      </div>
    </header>
    <div class="hazard thin" aria-hidden="true"></div>

    <div class="play">
      <div class="board-wrap">
        <canvas id="board" aria-label="Top-down view of the intersection. Tap a signal lamp on the road to switch it."></canvas>
        <div class="signals" id="signals" aria-label="Signal controls"></div>
        <div class="rush" id="rush" hidden></div>
      </div>
    </div>

    <footer class="dock" id="dock">
      <div class="hazard thin" aria-hidden="true"></div>
      <div class="dock-inner">
        <div class="goal-bar" aria-hidden="true"><span id="goal-fill"></span></div>
        <div class="patience" id="patience-row">
          <span class="mono-label">Patience</span>
          <div class="bar" id="patience-bar" role="progressbar" aria-label="City patience" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" data-level="ok">
            <div class="bar-fill" id="patience-fill"></div>
          </div>
          <span class="mono-value" id="patience-value">100%</span>
        </div>
        <div class="freeplay-bar" id="freeplay-bar" hidden>
          <label class="mono-label" for="live-density">Traffic density</label>
          <input type="range" id="live-density" min="1" max="10" step="1" value="5">
          <output id="live-density-value" for="live-density">Normal (5)</output>
          <span class="flow-state" id="flow-state"></span>
          <span class="fp-best" id="fp-best"></span>
        </div>
      </div>
    </footer>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="card" id="overlay-card"></div>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
