# Builds and tests the Swift game engine (core/) on every change to it.
# It doesn't build the app or upload anything to Apple, so it never makes a TestFlight build.
name: Core

on:
  workflow_dispatch:
  push:
    paths: ['core/**', '.github/workflows/core.yml']

permissions:
  contents: write   # to publish the board snapshots to the ci-snapshots branch

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test GridlockCore
        working-directory: core
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        # Errors first (each once), then the end of the run.
        run: |
          swift test > "$RUNNER_TEMP/test.log" 2>&1 && status=0 || status=$?
          grep -E "error:|failed \(|XCTAssert" "$RUNNER_TEMP/test.log" | awk '!seen[$0]++' | head -40
          echo "----"
          grep -vE '^\[[0-9]+/[0-9]+\] (Compiling|Emitting)|warning:' "$RUNNER_TEMP/test.log" | tail -40
          exit $status
      - name: Upload board snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      # The same images on a throwaway branch (overwritten each run), so they can be fetched with git.
      - name: Publish snapshots to the ci-snapshots branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/snapshots" 2>/dev/null || exit 0
          git init -q && git checkout -q -b ci-snapshots
          git add -A
          git -c user.name="Core CI" -c user.email="ci@users.noreply.github.com" commit -qm "Board snapshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots
