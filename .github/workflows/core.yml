# Builds and tests the Swift game engine (core/) on every change to it.
# It doesn't build the app or upload anything to Apple, so it never makes a TestFlight build.
name: Core

on:
  workflow_dispatch:
  push:
    paths: ['core/**', '.github/workflows/core.yml']

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test GridlockCore
        working-directory: core
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: swift test 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\] (Compiling|Emitting)' | tail -80
        shell: bash -o pipefail {0}
      - name: Upload board snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
